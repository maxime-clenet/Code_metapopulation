[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metapop"
version = "0.1.0"
description = "Metapopulation persistence in a dynamically changing landscape"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "networkx", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["metapop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
